[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "bpp-format"
version = "0.4.0"
description = "A token-efficient text format for feeding structured data and plans to LLMs, with a lossless JSON/YAML/CSV converter."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Furkan" }]
keywords = ["llm", "tokens", "json", "toon", "prompt", "serialization", "csv", "yaml", "markdown"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Text Processing",
]
dependencies = ["PyYAML>=5.4"]

[project.optional-dependencies]
stats = ["tiktoken>=0.7"]
api = ["anthropic>=0.40"]
dev = ["pytest>=7", "hypothesis>=6", "tiktoken>=0.7"]

[project.urls]
Homepage = "https://github.com/E7lektronXF/bpp"
Documentation = "https://github.com/E7lektronXF/bpp/blob/main/SPEC.md"
Benchmark = "https://github.com/E7lektronXF/bpp/blob/main/BENCHMARK.md"
Issues = "https://github.com/E7lektronXF/bpp/issues"

[project.scripts]
bpp = "bpp.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
